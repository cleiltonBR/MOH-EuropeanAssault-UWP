name: UWP source compatibility audit

on:
  push:
    branches: ["main", "uwp/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Scan desktop API assumptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run UWP compatibility triage
        run: python tools/uwp_audit.py
